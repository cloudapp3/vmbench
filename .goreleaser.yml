version: 2

project_name: vmbench

before:
  hooks:
    - go mod tidy

builds:
  - id: vmbench
    main: ./cmd/vmbench
    binary: vmbench
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/cloudapp3/vmbench.Version={{.Version}}
      - -X github.com/cloudapp3/vmbench.Commit={{.Commit}}
      - -X github.com/cloudapp3/vmbench.BuildTime={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- .Arch }}
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - LICENSE
      - README.md
      - docs/README.zh-CN.md
      - docs/CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: cloudapp3
    name: vmbench
  draft: false
  prerelease: auto
  mode: replace

nfpms:
  - id: packages
    package_name: vmbench
    maintainer: cloudapp3
    description: Cross-platform VPS benchmark suite with raw metrics and structured reports
    homepage: https://github.com/cloudapp3/vmbench
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/vmbench/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/vmbench/README.md
