# CLI surface: usage, flags, errors, notices, progress, tables, sysinfo labels.

[cli.usage.tagline]
other = "vmbench — cross-platform CPU and network benchmark toolkit"

[cli.usage.header]
other = "Usage:"

[cli.usage.cmdBench]
other = "run benchmarks; --preset/--only/--skip select sections"

[cli.usage.cmdTui]
other = "interactive TUI mode"

[cli.usage.cmdMcp]
other = "expose MCP tools over stdio"

[cli.usage.cmdList]
other = "list available workloads"

[cli.usage.cmdNodes]
other = "manage versioned network nodes"

[cli.usage.cmdTools]
other = "provision static benchmark tool binaries"

[cli.usage.cmdSysinfo]
other = "show system information"

[cli.usage.cmdCompare]
other = "compare two reports"

[cli.usage.cmdScore]
other = "assess a report against the scoring baseline"

[cli.usage.cmdHistory]
other = "manage local report history"

[cli.usage.cmdUpdate]
other = "self-update to the latest GitHub release"

[cli.usage.cmdVersion]
other = "show version"

[cli.usage.cmdUninstall]
other = "remove vmbench, its history, and owned data"

[cli.usage.detailHint]
other = "Run 'vmbench --help' for benchmark flags, or 'vmbench mcp serve --help' for MCP server flags."

[cli.usage.benchDetail]
other = "Run hardware benchmarks and, with --preset/--only/--skip, the network diagnostic sections. Without a section selection this runs the hardware benchmark only."

[cli.usage.flags]
other = "Flags:"

[cli.usage.presets]
other = "Presets:"

[cli.usage.speedProviders]
other = "Speed providers:"

[cli.usage.hardwareTools]
other = "Hardware tools:"

[cli.usage.requires]
other = "Requires"

[cli.usage.defaultTool]
other = "Default."

[cli.usage.listDetail]
other = "List available workloads."

[cli.usage.sysinfoDetail]
other = "Show system information for the current host."

[cli.usage.compareDetail]
other = "Compare two benchmark reports side by side."

[cli.usage.scoreDetail]
other = "Evaluate a report with the deterministic scoring baseline (no LLM involved). Flags: --json, --out, --baseline, --baseline-rev."

[cli.usage.updateDetail]
other = "Check GitHub Releases for a newer vmbench and replace this binary in place (SHA-256 verified against the release checksums.txt)."

[cli.usage.nodesCommands]
other = "Commands:"

[cli.usage.nodesList]
other = "list nodes from a selected catalog"

[cli.usage.nodesVerify]
other = "validate schema/revision and optionally a detached signature"

[cli.usage.nodesUpdate]
other = "download and cache a mandatory Ed25519-signed catalog"

[cli.usage.nodesHealth]
other = "run lightweight HEAD/DNS/TCP availability checks"

[cli.usage.nodesCatalog]
other = "Catalog selection:"

[cli.flag.iterations]
other = "iterations per workload (1-9)"

[cli.flag.filter]
other = "run workloads matching regex"

[cli.flag.lang]
other = "interface language (en, zh-CN)"

[cli.flag.diskPath]
other = "disk benchmark temp directory"

[cli.flag.timeout]
other = "per-section timeout (default 5m; hardware applies it per workload)"

[cli.flag.json]
other = "write JSON report to file"

[cli.flag.html]
other = "write HTML report to file"

[cli.flag.markdown]
other = "write forum-pasteable markdown report to file (sections in fenced code blocks, media folded)"

[cli.flag.quiet]
other = "suppress progress output"

[cli.flag.autoSwap]
other = "(Linux) low-memory geekbench runs: create a temporary swapfile without asking"

[cli.flag.hardwareTool]
other = "hardware tools (comma-separated: sysbench,openssl,fio,dd,stream,mbw,geekbench,winsat; use all for every adapter)"

[cli.flag.saveHistory]
other = "save the report to local history"

[cli.flag.historyTag]
other = "optional tag used with --save-history"

[cli.flag.nodeCatalog]
other = "node catalog source: embedded, auto (fetch with cache fallback), or a JSON path"

[cli.flag.nodeRevision]
other = "require an exact node catalog revision"

[cli.flag.nodeCache]
other = "cache path override used with --node-catalog auto"

[cli.flag.preset]
other = "scenario preset: quick, website, proxy, mail"

[cli.flag.routePresets]
other = "comma-separated route presets (gz,bj,sh,cd,cernet,cstnet)"

[cli.flag.speedProvider]
other = "speed providers (comma-separated: cloudflare,speedtest_net,speedtest_cn,iperf3,china_isp,speedtest_isp)"

[cli.flag.iperfHost]
other = "iperf3 server(s) for speed section (comma-separated)"

[cli.flag.only]
other = "run only selected sections (comma-separated: hardware,network_info,route,ping,speed,ip,reachability,mail,media)"

[cli.flag.skip]
other = "skip selected sections (comma-separated: hardware,network_info,route,ping,speed,ip,reachability,mail,media)"

[cli.flag.ipVersion]
other = "network IP version: v4, v6, or dual"

[cli.flag.mediaSet]
other = "media unlock set: all, globe, tw, hk, jp, kr, na, sa, eu, afr, sea, oce, ai, or comma combinations (default globe)"

[cli.flag.ipQualitySource]
other = "IP quality evidence sources (comma-separated: builtin,securitycheck)"

[cli.flag.redact]
other = "mask this machine's public IPs in reports: ips (default) or none"

[cli.flag.jsonSysinfo]
other = "output as JSON"

[cli.flag.nodeCatalogNodes]
other = "catalog source: embedded, auto (fetch), or JSON path"

[cli.flag.nodeCacheNodes]
other = "override auto catalog cache path"

[cli.flag.jsonOutput]
other = "output JSON"

[cli.flag.nodesKind]
other = "filter kind: download, upload, route, ping, or route_ping"

[cli.flag.nodesFamily]
other = "filter IP family: v4, v6, dual, or any"

[cli.flag.nodesRegion]
other = "filter region"

[cli.flag.nodesCity]
other = "filter city"

[cli.flag.nodesCarrier]
other = "filter carrier"

[cli.flag.nodesKindShort]
other = "filter kind"

[cli.flag.nodesFamilyShort]
other = "filter IP family"

[cli.flag.signature]
other = "detached signature path or URL"

[cli.flag.publicKey]
other = "Ed25519 public key file"

[cli.flag.publicKeyValue]
other = "inline base64, hex, or PEM Ed25519 public key"

[cli.flag.signatureTimeout]
other = "signature download timeout"

[cli.flag.updateURL]
other = "node catalog manifest URL"

[cli.flag.updateCache]
other = "cache destination (default user cache)"

[cli.flag.updateTimeout]
other = "complete update timeout"

[cli.flag.healthTimeout]
other = "timeout per node"

[cli.flag.healthConcurrency]
other = "concurrent checks (1-32)"

[cli.flag.historyLast]
other = "compare the latest N reports"

